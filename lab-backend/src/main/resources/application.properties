# --- NiFi Lab -------------------------------------------------------------------------------------------
# Defaults are for dev mode: backend on the host (./mvnw quarkus:dev), NiFi in Docker (docker compose up nifi).
# docker-compose.yml overrides them with environment variables (LAB_NIFI_URL, ...) for the full stack.
lab.nifi.url=https://localhost:8443
lab.nifi.ui-url=https://localhost:8443
lab.nifi.username=nifilab
lab.nifi.password=nifilabpassword
lab.nifi.listen-host=localhost
lab.sink-base-url=http://host.docker.internal:8080
lab.live.poll-interval=1s

# --- NiFi REST client -----------------------------------------------------------------------------------
quarkus.rest-client.nifi.url=${lab.nifi.url}/nifi-api
quarkus.rest-client.nifi.tls-configuration-name=nifi
quarkus.rest-client.nifi.connect-timeout=5000
quarkus.rest-client.nifi.read-timeout=30000
# LAB ONLY: NiFi generates a self-signed certificate on first start, so it is trusted blindly.
quarkus.tls.nifi.trust-all=true
quarkus.tls.nifi.hostname-verification-algorithm=NONE

# --- Web UI (Quinoa builds src/main/webui with npm and serves it) ---------------------------------------
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.build-dir=dist
quarkus.http.port=8080

quarkus.log.category."org.mylabs".level=INFO

# --- Tests ----------------------------------------------------------------------------------------------
%test.quarkus.quinoa=false
%test.lab.deploy-on-startup=false
%test.quarkus.http.test-port=8081
